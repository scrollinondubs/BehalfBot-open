# BehalfBot-open compose stack - the containerized open-weight lane (Jill).
#
#   Discord -> discord-bridge -> opencode-serve (compose network) -> Venice GLM-5.2
#
# Isolation posture (issue #9): no /Users mounts, no Docker socket, no host
# home, non-root user, private compose network. As of 2026-07-27 there is NO
# host port exposure at all - see below.
#
# WHY THE PORT PUBLISH WAS REMOVED (Fable red-team, 2026-07-27)
#
# This file used to publish the opencode API on 127.0.0.1:4948 and describe it
# as "loopback only". Under Colima that description is false. Every container
# on the box resolves host.docker.internal - Colima injects it regardless of
# extra_hosts - so a loopback-published port is reachable from ANY container,
# including Jax's chassis.
#
# The API has no auth layer. Verified from inside the chassis container:
#   GET  http://host.docker.internal:4948/session              -> 200, session list
#   GET  http://host.docker.internal:4948/session/<id>/message -> 200, full transcript
# and the surface includes POST /session/{id}/shell, /pty, prompt_async and
# PATCH /config. So Jax could read Jill's transcripts and make Jill run
# arbitrary shell commands - a confused deputy that defeats any trust boundary
# built on top of it, since Jill holds the private-side credentials.
#
# Nothing functional needed the publish: discord-bridge reaches serve over the
# compose network at http://opencode-serve:4747, and the healthcheck runs
# inside the container against 127.0.0.1:4747. Only ad-hoc host smoke tests
# used it, and those can use `docker compose exec opencode-serve` instead.
#
# If a host port is ever genuinely needed again, add an auth token FIRST.
# Removing the publish is the boundary; it is not defence in depth.
#
# Secrets: compose interpolates ${VARS} from the gitignored .env in this
# directory. Deliberately NOT `env_file:` on both services - per-service
# `environment:` blocks mean the serve container never sees the Discord
# token and the bridge container never sees the Venice key. Least privilege.
#
# BRIDGE_DRY_RUN defaults to 1 (bridge validates config + resolves serve,
# never opens a Discord gateway session - the host bridge holds the single
# Jill token). docker/cutover.sh flips it to 0 in .env at cutover time.

services:
  opencode-serve:
    build: .
    image: behalfbot-open:latest
    container_name: behalfbot-opencode-serve
    command: ["opencode", "serve", "--port", "4747", "--hostname", "0.0.0.0"]
    working_dir: /app
    environment:
      VENICE_API_KEY: ${VENICE_API_KEY:?set VENICE_API_KEY in .env}
      BEHALFBOT_MEMORY_FILE: /data/memory.jsonl
    # NO ports: stanza. Deliberate - see the header. The API is reachable only
    # from inside the `behalfbot` compose network, by service name. Publishing
    # it to host loopback exposes it to every container on the box via
    # host.docker.internal, and it has no authentication.
    expose:
      - "4747"
    volumes:
      - opencode-data:/home/node/.local/share/opencode
      - serve-data:/data
    networks: [behalfbot]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4747/global/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  discord-bridge:
    build: .
    image: behalfbot-open:latest
    container_name: behalfbot-discord-bridge
    command: ["python3", "bridge/discord_bridge.py"]
    working_dir: /app
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in .env}
      JAX_OPEN_CHANNEL_ID: ${JAX_OPEN_CHANNEL_ID:?set JAX_OPEN_CHANNEL_ID in .env}
      PRINCIPAL_USER_ID: ${PRINCIPAL_USER_ID:?set PRINCIPAL_USER_ID in .env}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-venice/zai-org-glm-5-2}
      # Service name, not localhost: the bridge reaches serve over the
      # private compose network.
      OPENCODE_SERVER_URL: http://opencode-serve:4747
      BRIDGE_SESSIONS_FILE: /data/sessions.json
      BRIDGE_DRY_RUN: ${BRIDGE_DRY_RUN:-1}
    volumes:
      - bridge-state:/data
    depends_on:
      opencode-serve:
        condition: service_healthy
    networks: [behalfbot]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Opt-in scheduled-work engine (docs/heartbeat-dispatcher.md). Start with:
  #   cp HEARTBEATS.md.template HEARTBEATS.md   # compose bind-mounts this file
  #   docker compose --profile dispatcher up -d
  # Runs attach to opencode-serve over the private network, so this container
  # needs no provider keys of its own (least privilege, same as the bridge).
  heartbeat-dispatcher:
    build: .
    image: behalfbot-open:latest
    container_name: behalfbot-heartbeat-dispatcher
    profiles: [dispatcher]
    command:
      - bash
      - -c
      - 'while true; do bash scheduled-tasks/heartbeat-dispatcher.sh || true; sleep "$${DISPATCHER_INTERVAL_SECONDS:-900}"; done'
    working_dir: /app
    environment:
      BEHALFBOT_HOME: /app
      BEHALFBOT_STATE_HOME: /data
      OPENCODE_ATTACH_URL: http://opencode-serve:4747
      DISPATCHER_INTERVAL_SECONDS: ${DISPATCHER_INTERVAL_SECONDS:-900}
      HEARTBEAT_MODEL_OPUS: ${HEARTBEAT_MODEL_OPUS:-}
      HEARTBEAT_MODEL_SONNET: ${HEARTBEAT_MODEL_SONNET:-}
      HEARTBEAT_MODEL_HAIKU: ${HEARTBEAT_MODEL_HAIKU:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_OPS_WEBHOOK_URL: ${DISCORD_OPS_WEBHOOK_URL:-}
      INSTANCE_NAME: ${INSTANCE_NAME:-}
    volumes:
      - ./HEARTBEATS.md:/app/HEARTBEATS.md:ro
      - ./scheduled-tasks:/app/scheduled-tasks:ro
      - ./scripts:/app/scripts:ro
      - dispatcher-state:/data
    depends_on:
      opencode-serve:
        condition: service_healthy
    networks: [behalfbot]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  behalfbot:
    driver: bridge

volumes:
  opencode-data:    # opencode serve state + session history
  serve-data:       # memory MCP jsonl
  bridge-state:     # bridge/.sessions.json successor (channel -> session map)
  dispatcher-state: # heartbeat state, logs, telemetry, briefings
