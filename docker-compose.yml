# BehalfBot-open compose stack - the containerized open-weight lane (Jill).
#
#   Sean (Element X) -> Matrix, end-to-end encrypted -> matrix-bridge
#     -> api-proxy -> opencode-serve -> venice-proxy -> Venice GLM-5.2
#
# Isolation posture (issue #9): no /Users mounts, no Docker socket, no host
# home, non-root user, private compose network. As of 2026-07-27 there is NO
# host port exposure at all - see below.
#
# WHY THE PORT PUBLISH WAS REMOVED (Fable red-team, 2026-07-27)
#
# This file used to publish the opencode API on 127.0.0.1:4948 and describe it
# as "loopback only". Under Colima that description is false. Every container
# on the box resolves host.docker.internal - Colima injects it regardless of
# extra_hosts - so a loopback-published port is reachable from ANY container,
# including Jax's chassis.
#
# The API has no auth layer. Verified from inside the chassis container:
#   GET  http://host.docker.internal:4948/session              -> 200, session list
#   GET  http://host.docker.internal:4948/session/<id>/message -> 200, full transcript
# and the surface includes POST /session/{id}/shell, /pty, prompt_async and
# PATCH /config. So Jax could read Jill's transcripts and make Jill run
# arbitrary shell commands - a confused deputy that defeats any trust boundary
# built on top of it, since Jill holds the private-side credentials.
#
# Nothing functional needed the publish: the bridge reaches serve over the
# compose network (through api-proxy), and the healthcheck runs
# inside the container against 127.0.0.1:4747. Only ad-hoc host smoke tests
# used it, and those can use `docker compose exec opencode-serve` instead.
#
# If a host port is ever genuinely needed again, add an auth token FIRST.
# Removing the publish is the boundary; it is not defence in depth.
#
# CONTAINMENT (#46, after two red-team rounds): the model can run arbitrary
# code inside opencode-serve, and some OpenCode code paths (prompt @file
# expansion, LSP, formatters) run outside any guard hook. So the server
# itself is treated as untrusted:
#
#   secrets   opencode-serve holds NONE: no upstream key, no API password, no
#             caller token. Each upstream key lives only in its gateway.
#   uid/caps  opencode-serve runs as node, non-root, no capabilities.
#   network   jill-netns owns serve's network namespace and firewalls it
#             (runtime/setup-netns.sh): API only from api-proxy, no loopback
#             API, no Docker/Colima gateway host, nothing outside
#             jill-internal. jill-internal itself has no route out.
#   API       api-proxy (password held by bridge and dispatcher only) allows
#             a route list: no MCP registration, shell, PTY, config writes.
#   approval  sending email and fetching a web page need Sean's one-shot
#             approval (gateway/approvals.py), written only by the bridge or
#             dispatcher into a volume serve does not mount.
#   control   jill-control (gateway/control.py) holds the Matrix token,
#             listens for halt/resume from Sean, posts alerts and watches
#             credential expiry. It is not on jill-internal and listens on
#             no port. It shares only volumes, none of which serve mounts:
#             control-state (it and matrix-bridge write; venice-proxy
#             and dispatcher read),
#             alert-spool (dispatcher writes, it posts), cred-<gateway>
#             (each gateway writes its own probe result, it reads) and
#             venice-meter (venice-proxy writes, it reads). venice-proxy
#             refuses every model call while halted. docs/control.md.
#   scan      the injection scanner (#51) in serve writes content-free
#             alert files to scan-alerts, the ONE volume serve shares with
#             jill-control. The model can write it too (same uid), so
#             jill-control posts nothing from it: fixed enums only, bucketed
#             counts, a cooldown. A 1 MB tmpfs, so it cannot fill a disk.
#
#   Matrix (E2EE) -> matrix-bridge -> api-proxy -> opencode-serve -> venice-proxy -> Venice
#                                                    -> agentmail-proxy -> AgentMail
#                                                    -> siyuan-proxy -> SiYuan
#                                                    -> brave-proxy -> brave-mcp -> Brave
#                                                    -> fetch-gateway -> approved URLs
#
# Secrets: compose interpolates ${VARS} from the gitignored .env in this
# directory. Per-service `environment:` blocks, never `env_file:`, so each
# container gets only what it needs. The API password is a random string
# generated at install (see .env.example).
#
# CHAT (#50): matrix-bridge holds Jill's Matrix device keys, cross-signing
# state, access token and the pin of Sean's master key, all in the
# matrix-bridge-state volume, mounted into no other service (bar its
# one-off setup command). The homeserver
# is administered by someone else (Jax), so the bridge trusts it for
# nothing: it acts only on messages that decrypt, come from Sean, and come
# from a device cross-signed by the master key pinned at setup, and it
# encrypts only to those devices. No server-side key backup. Setup is
# interactive and once: `docker compose run --rm matrix-bridge-setup`
# (bridge/WIRING.md).

services:
  # --- network namespace owner and firewall for opencode-serve ---------------
  jill-netns:
    image: behalfbot-open:latest
    container_name: behalfbot-jill-netns
    user: root
    command: ["/opt/jill/bin/setup-netns.sh"]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      INTERNAL_SUBNET: ${JILL_INTERNAL_SUBNET:-10.231.0.0/24}
      INTERNAL_GATEWAY: ${JILL_INTERNAL_GATEWAY:-10.231.0.1}
      API_PROXY_IP: ${JILL_API_PROXY_IP:-10.231.0.10}
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    networks:
      jill-internal:
        aliases: [opencode-serve]
    read_only: true
    tmpfs: [/tmp, /run]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/netns-ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # --- the model -----------------------------------------------------------
  opencode-serve:
    build: .
    image: behalfbot-open:latest
    container_name: behalfbot-opencode-serve
    # Self-test (guards, containment, subagent, hostile cwd), then serve.
    command: ["bash", "/app/selftest/serve-entrypoint.sh"]
    working_dir: /app
    network_mode: "service:jill-netns"
    cap_drop: [ALL]
    environment:
      VENICE_BASE_URL: http://venice-proxy:8080/api/v1
      BEHALFBOT_MEMORY_FILE: /data/memory.jsonl
      JILL_EXPECT_FIREWALL: "1"
      INJECTION_ALERT_DIR: /state/scan-alerts
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/opencode/state:uid=1000,gid=1000,mode=0700
      - /var/cache/opencode:uid=1000,gid=1000,mode=0700
      - /home/node/.cache:uid=1000,gid=1000
      - /home/node/.local/state:uid=1000,gid=1000
    volumes:
      - opencode-data:/var/lib/opencode/data
      - serve-data:/data
      - workspace:/workspace
      - scan-alerts:/state/scan-alerts
    depends_on:
      jill-netns:
        condition: service_healthy
      venice-proxy:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Nothing in this namespace can reach the API (by design); the
      # entrypoint writes this file once serve is listening.
      test: ["CMD", "test", "-f", "/tmp/serve-ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 240s

  # --- gateways: the only exits from jill-internal ---------------------------
  api-proxy:
    image: behalfbot-open:latest
    container_name: behalfbot-api-proxy
    command: ["python3", "/app/gateway/gateway.py"]
    environment:
      GATEWAY_ROUTE: api
      UPSTREAM_URL: http://opencode-serve:4747
      GATEWAY_LISTEN: 0.0.0.0:4748
      GATEWAY_BASIC_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
    networks:
      jill-internal:
        ipv4_address: ${JILL_API_PROXY_IP:-10.231.0.10}
      jill-control: {}
    depends_on:
      opencode-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"opencode:$$GATEWAY_BASIC_PASSWORD\" http://127.0.0.1:4748/global/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    <<: &gateway
      read_only: true
      cap_drop: [ALL]
      # A gateway parses caller-controlled bodies; a bounded memory limit
      # turns a memory bomb into a refused request or a restart, not a host
      # problem (red-team R3-1). venice-proxy's meter survives a restart.
      mem_limit: 512m
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true

  venice-proxy:
    image: behalfbot-open:latest
    container_name: behalfbot-venice-proxy
    command: ["python3", "/app/gateway/gateway.py"]
    environment:
      GATEWAY_ROUTE: venice
      UPSTREAM_KEY: ${VENICE_API_KEY:?set VENICE_API_KEY in .env}
      # Venice "private" inference only; keep in step with opencode.json.
      # Every model here needs a price in VENICE_PRICES or the proxy refuses
      # to start. zai-org-glm-5-1, kimi-k2-7-code and deepseek-v4-pro were
      # removed: no price could be sourced with confidence (2026-11-21).
      VENICE_MODELS: zai-org-glm-5-2,z-ai-glm-5-3-flash
      CREDENTIAL_STATUS_DIR: /state/credentials
      # The main control (#49): every model call, chat included, is refused
      # while halted or while the kill switch is not listening, and a daily
      # meter enforces a hard ceiling from the responses' own usage.
      CONTROL_DIR: /state/control
      CONTROL_REQUIRE_ARMED: "1"
      GATEWAY_STATE_DIR: /state/gateway
      VENICE_MAX_USD_PER_DAY: ${VENICE_MAX_USD_PER_DAY:-5}
      VENICE_MAX_REQUESTS_PER_DAY: ${VENICE_MAX_REQUESTS_PER_DAY:-2000}
      VENICE_MAX_REQUESTS_PER_MINUTE: ${VENICE_MAX_REQUESTS_PER_MINUTE:-30}
      VENICE_MAX_IN_FLIGHT: ${VENICE_MAX_IN_FLIGHT:-4}
      VENICE_MAX_OUTPUT_TOKENS: ${VENICE_MAX_OUTPUT_TOKENS:-8192}
      VENICE_PRICES: ${VENICE_PRICES:-}
    volumes:
      - cred-venice:/state/credentials
      - control-state:/state/control:ro
      - venice-meter:/state/gateway
    networks: [jill-internal, jill-egress]
    <<: *gateway

  agentmail-proxy:
    image: behalfbot-open:latest
    container_name: behalfbot-agentmail-proxy
    command: ["python3", "/app/gateway/gateway.py"]
    environment:
      GATEWAY_ROUTE: agentmail
      UPSTREAM_KEY: ${AGENTMAIL_API_KEY:-}
      AGENTMAIL_INBOX: ${AGENTMAIL_INBOX:-jill-agent@agentmail.to}
      APPROVALS_DIR: /state/approvals
      GATEWAY_STATE_DIR: /state/gateway
      CREDENTIAL_STATUS_DIR: /state/credentials
    volumes:
      - approvals:/state/approvals:ro
      - agentmail-state:/state/gateway
      - cred-agentmail:/state/credentials
    networks: [jill-internal, jill-egress]
    <<: *gateway

  fetch-gateway:
    image: behalfbot-open:latest
    container_name: behalfbot-fetch-gateway
    command: ["python3", "/app/gateway/gateway.py"]
    environment:
      GATEWAY_ROUTE: fetch
      APPROVALS_DIR: /state/approvals
      GATEWAY_STATE_DIR: /state/gateway
    volumes:
      - approvals:/state/approvals:ro
      - fetch-state:/state/gateway
    networks: [jill-internal, jill-egress]
    <<: *gateway

  siyuan-proxy:
    image: behalfbot-open:latest
    container_name: behalfbot-siyuan-proxy
    command: ["python3", "/app/gateway/gateway.py"]
    environment:
      GATEWAY_ROUTE: siyuan
      UPSTREAM_URL: ${SIYUAN_URL:-}
      UPSTREAM_KEY: ${SIYUAN_TOKEN:-}
      CREDENTIAL_STATUS_DIR: /state/credentials
    volumes:
      - cred-siyuan:/state/credentials
    networks: [jill-internal, jill-egress]
    <<: *gateway

  # Brave's MCP server cannot be pointed at another API host, so it runs here
  # with the key, on a network opencode-serve is not on, behind brave-proxy.
  brave-mcp:
    image: behalfbot-open:latest
    container_name: behalfbot-brave-mcp
    command: ["node", "/opt/mcp/node_modules/@brave/brave-search-mcp-server/dist/index.js",
              "--transport", "http", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    networks: [jill-brave, jill-egress]
    <<: *gateway

  brave-proxy:
    image: behalfbot-open:latest
    container_name: behalfbot-brave-proxy
    command: ["python3", "/app/gateway/gateway.py"]
    environment:
      GATEWAY_ROUTE: mcp
      UPSTREAM_URL: http://brave-mcp:8080
    networks: [jill-internal, jill-brave]
    <<: *gateway

  # --- control: kill switch, alerts, credential expiry (#49) ---------------
  # Holds the Matrix token; Jill holds nothing and cannot reach it. Not on
  # jill-internal, no listening port. Its boot self-test (token valid, both
  # rooms joined and NOT encrypted, control room readable) must pass before
  # it reports healthy, and the dispatcher will not start until it does.
  jill-control:
    image: behalfbot-open:latest
    container_name: behalfbot-jill-control
    command: ["python3", "/app/gateway/control.py"]
    environment:
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-http://host.docker.internal:8008}
      MATRIX_CONTROL_TOKEN: ${MATRIX_CONTROL_TOKEN:?set MATRIX_CONTROL_TOKEN in .env (docs/control.md)}
      MATRIX_PRINCIPAL: ${MATRIX_PRINCIPAL:?set MATRIX_PRINCIPAL in .env (docs/control.md)}
      MATRIX_CONTROL_ROOM: ${MATRIX_CONTROL_ROOM:?set MATRIX_CONTROL_ROOM in .env (docs/control.md)}
      MATRIX_ALERTS_ROOM: ${MATRIX_ALERTS_ROOM:-}
      CONTROL_DIR: /state/control
      ALERT_SPOOL_DIR: /state/alerts
      CREDENTIAL_STATUS_DIR: /state/credentials
      CREDENTIAL_EXPECT: ${CREDENTIAL_EXPECT:-venice}
      CREDENTIAL_EXPIRES: ${CREDENTIAL_EXPIRES:-}
      VENICE_METER_DIR: /state/venice/meter
      VENICE_ALERT_USD_PER_DAY: ${VENICE_ALERT_USD_PER_DAY:-1}
      SCAN_ALERT_DIR: /state/scan-alerts
      SCAN_ALERT_COOLDOWN_SECONDS: ${SCAN_ALERT_COOLDOWN_SECONDS:-900}
    volumes:
      - control-state:/state/control
      - alert-spool:/state/alerts
      # Written by opencode-serve's injection scanner, so model-forgeable;
      # read as fixed enums only (gateway/control.py, INJECTION-SCAN ALERTS).
      - scan-alerts:/state/scan-alerts
      # One volume per gateway, each read-only here: no gateway can write
      # another's credential record.
      - cred-venice:/state/credentials/venice:ro
      - cred-agentmail:/state/credentials/agentmail:ro
      - cred-siyuan:/state/credentials/siyuan:ro
      - venice-meter:/state/venice:ro
    networks: [jill-callers]
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/control-ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    <<: *gateway

  # --- trusted callers: hold the API password and write approvals ----------
  matrix-bridge:
    build: .
    image: behalfbot-open:latest
    container_name: behalfbot-matrix-bridge
    command: ["/opt/jill/bin/matrix-bridge", "run"]
    working_dir: /app
    # Round 6 M4. The bridge runs as root with every capability dropped but
    # SETUID/SETGID, which it needs for one thing: starting the Python worker
    # as node (1000). The kernel switches the child's uid before exec; with
    # no capabilities left, the worker cannot switch back. Bridge state is
    # root 0700, so the worker cannot read the token, pickle key or crypto
    # store. `matrix-bridge isolation-check` proves it (CI runs it).
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    mem_limit: 512m
    pids_limit: 128
    environment: &matrix-bridge-env
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-http://host.docker.internal:8008}
      MATRIX_PRINCIPAL: ${MATRIX_PRINCIPAL:?set MATRIX_PRINCIPAL in .env (bridge/WIRING.md)}
      MATRIX_JILL_ROOM: ${MATRIX_JILL_ROOM:?set MATRIX_JILL_ROOM in .env (bridge/WIRING.md)}
      MATRIX_JILL_USER: ${MATRIX_JILL_USER:-}
      MATRIX_BRIDGE_STATE: /state/matrix-bridge
      BRIDGE_READY_FILE: /tmp/bridge-ready
      # Python worker (bridge/matrix_worker.py), a child of the Go binary,
      # run as this uid/gid and kept out of /state/matrix-bridge
      BRIDGE_WORKER_UID: "1000"
      BRIDGE_WORKER_GID: "1000"
      WORKER_STATE_DIR: /state/matrix-worker
      # The chat step (PDF parsing, model replies) runs as a third uid that
      # cannot write approvals, the halt or meter flags, or the alert spool,
      # nor read the worker's codes (round 6b N6).
      BRIDGE_CHAT_UID: "1001"
      BRIDGE_CHAT_GID: "1001"
      BRIDGE_SESSIONS_FILE: /state/matrix-chat/sessions.json
      DEFAULT_MODEL: ${DEFAULT_MODEL:-venice/zai-org-glm-5-2}
      OPENCODE_SERVER_URL: http://api-proxy:4748
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      # halt / resume / reset meter from the encrypted room write here
      CONTROL_DIR: /state/control
      # identity-change and room-change alerts; jill-control posts them
      ALERT_SPOOL_DIR: /state/alerts
      # Sean's approvals land here; `show draft` reads the snapshot that
      # agentmail-proxy will send, read-only, with no network path to it
      APPROVALS_DIR: /state/approvals
      SNAPSHOT_DIR: /state/agentmail-gw/drafts
      CONSUMED_DIRS: /state/agentmail-gw/consumed:/state/fetch-gw/consumed
    volumes:
      - matrix-bridge-state:/state/matrix-bridge
      - matrix-worker-state:/state/matrix-worker
      - matrix-chat-state:/state/matrix-chat
      - control-state:/state/control
      - alert-spool:/state/alerts
      - approvals:/state/approvals
      - agentmail-state:/state/agentmail-gw:ro
      - fetch-state:/state/fetch-gw:ro
    depends_on:
      api-proxy:
        condition: service_healthy
    networks: [jill-control, jill-callers]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Written after the first successful sync with the crypto store loaded.
      test: ["CMD", "test", "-f", "/tmp/bridge-ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Interactive, once (and again only to re-pin Sean's identity):
  #   docker compose run --rm matrix-bridge-setup
  # Prompts for Jill's password and prints her recovery key to the terminal
  # only. Logging is off for this service so the recovery key never reaches
  # a Docker log.
  matrix-bridge-setup:
    image: behalfbot-open:latest
    container_name: behalfbot-matrix-bridge-setup
    profiles: [setup]
    command: ["/opt/jill/bin/matrix-bridge", "setup"]
    environment:
      <<: *matrix-bridge-env
      MATRIX_JILL_USER: ${MATRIX_JILL_USER:?set MATRIX_JILL_USER in .env (bridge/WIRING.md)}
    volumes:
      - matrix-bridge-state:/state/matrix-bridge
    networks: [jill-callers]
    stdin_open: true
    tty: true
    logging:
      driver: none
    read_only: true
    tmpfs: [/tmp]
    user: "0:0"
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  # Scheduled-work engine, OFF by default (Sean, 2026-11-21: Jill launches
  # with no heartbeats and runs only when he messages her). To turn it on:
  #   cp HEARTBEATS.md.template HEARTBEATS.md   # compose bind-mounts this file
  #   docker compose --profile heartbeats up -d
  # Runs attach through api-proxy, so tools run in serve, inside containment.
  heartbeat-dispatcher:
    build: .
    image: behalfbot-open:latest
    container_name: behalfbot-heartbeat-dispatcher
    profiles: [heartbeats]
    command:
      - bash
      - -c
      - 'bash scheduled-tasks/dispatcher-selftest.sh || exit 1; while true; do bash scheduled-tasks/heartbeat-dispatcher.sh || true; sleep "$${DISPATCHER_INTERVAL_SECONDS:-900}"; done'
    working_dir: /app
    environment:
      BEHALFBOT_HOME: /app
      BEHALFBOT_STATE_HOME: /state/dispatcher
      XDG_DATA_HOME: /state/dispatcher/xdg/data
      XDG_STATE_HOME: /state/dispatcher/xdg/state
      XDG_CACHE_HOME: /state/dispatcher/xdg/cache
      XDG_CONFIG_HOME: /etc/opencode-xdg
      OPENCODE_ATTACH_URL: http://api-proxy:4748
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}
      APPROVALS_DIR: /state/approvals
      CONSUMED_DIRS: /state/agentmail-gw/consumed:/state/fetch-gw/consumed
      DISPATCHER_INTERVAL_SECONDS: ${DISPATCHER_INTERVAL_SECONDS:-900}
      HEARTBEAT_MODEL_OPUS: ${HEARTBEAT_MODEL_OPUS:-}
      HEARTBEAT_MODEL_SONNET: ${HEARTBEAT_MODEL_SONNET:-}
      HEARTBEAT_MODEL_HAIKU: ${HEARTBEAT_MODEL_HAIKU:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      # Control (#49, docs/control.md). The flags are read-only here.
      CONTROL_DIR: /state/control
      CONTROL_REQUIRE_ARMED: "1"
      ALERT_SPOOL_DIR: /state/alerts
      SELFTEST_LIVE: "1"
      DISPATCHER_MAX_USD_PER_DAY: ${DISPATCHER_MAX_USD_PER_DAY:-1}
      DISPATCHER_DEFAULT_MAX_FIRES_PER_DAY: ${DISPATCHER_DEFAULT_MAX_FIRES_PER_DAY:-24}
      VENICE_PRICES: ${VENICE_PRICES:-}
    volumes:
      - ./HEARTBEATS.md:/app/HEARTBEATS.md:ro
      - ./scheduled-tasks:/app/scheduled-tasks:ro
      - ./scripts:/app/scripts:ro
      - dispatcher-state:/state/dispatcher
      - approvals:/state/approvals
      - agentmail-state:/state/agentmail-gw:ro
      - fetch-state:/state/fetch-gw:ro
      - control-state:/state/control:ro
      - alert-spool:/state/alerts
    depends_on:
      api-proxy:
        condition: service_healthy
      jill-control:
        condition: service_healthy
    networks: [jill-control, jill-callers]
    cap_drop: [ALL]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  # No route out. opencode-serve's namespace (via jill-netns) is on this
  # network only, and firewalled further inside the namespace.
  jill-internal:
    internal: true
    ipam:
      config:
        - subnet: ${JILL_INTERNAL_SUBNET:-10.231.0.0/24}
          gateway: ${JILL_INTERNAL_GATEWAY:-10.231.0.1}
  # api-proxy <-> bridge, dispatcher. serve is not on it.
  jill-control:
    internal: true
  # Ordinary outbound network for the gateways.
  jill-egress:
    driver: bridge
  # Outbound for matrix-bridge and jill-control (Matrix) and the dispatcher,
  # kept apart from the gateways, which parse model-controlled
  # input.
  jill-callers:
    driver: bridge
  # brave-proxy <-> brave-mcp only; opencode-serve is not on it.
  jill-brave:
    internal: true

volumes:
  workspace:        # Jill's working files
  opencode-data:    # opencode serve data dir: sessions, history
  serve-data:       # memory MCP jsonl
  matrix-bridge-state: # Jill's Matrix device keys, cross-signing state, access token, the pin
                       # of Sean's master key, handled event ids, opencode session map.
                       # Mounted ONLY into matrix-bridge and matrix-bridge-setup. root 0700.
  matrix-worker-state: # the worker's one-time codes (node 0700)
  matrix-chat-state:   # the chat step's opencode session map (uid 1001)
  dispatcher-state: # heartbeat state, logs, telemetry, briefings
  approvals:        # Sean's one-shot approvals (matrix-bridge/dispatcher write, gateways read)
  agentmail-state:  # draft snapshots (what a send delivers), consumed approvals
  fetch-state:      # consumed URL approvals, URL requests
  control-state:    # halt.json, conservation-mode.json, armed.json, cursors (jill-control and matrix-bridge write)
  alert-spool:      # content-free alerts from the dispatcher and matrix-bridge, drained by jill-control
  scan-alerts:      # injection-scanner hits from opencode-serve (model-writable), drained by jill-control
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=1000,gid=1000,mode=0700"
  cred-venice:      # status-only credential probe result, venice-proxy writes
  cred-agentmail:   # ... agentmail-proxy writes
  cred-siyuan:      # ... siyuan-proxy writes
  venice-meter:     # venice-proxy's daily spend meter (jill-control reads it)
