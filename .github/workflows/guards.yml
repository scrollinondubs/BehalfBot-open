name: Guards

# No paths filter, same reasoning as shell-lint.yml: a filtered check that is
# ever made required deadlocks unrelated PRs.
#
# Two jobs, proving different things:
#   unit      the deny rules, gateway and control policy, the Matrix bridge's
#             acceptance rule (fast, no Docker)
#   selftest  the built image: guard files read-only, plugin actually loaded
#             by OpenCode, denials firing in the parent session AND in a
#             subagent, against a scripted local model. No keys, no network
#             inside the container.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard policy unit tests
        run: node --experimental-strip-types --test tests/guards/*.test.ts
      - name: Venice-only model resolution
        run: bash tests/test-resolve-model.sh
      - name: Gateway policies (decoded paths, model allowlist, recipients, caller auth, credential probe)
        run: python3 -m unittest discover -s tests/gateway -v
      - name: Kill switch, alert spool, credential expiry (jill-control vs a fake homeserver)
        run: python3 -m unittest discover -s tests/control -v
      - name: Matrix bridge worker (commands, halt gate, approval screen, approve binding)
        run: python3 -m unittest discover -s tests/bridge -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: matrix-bridge/go.mod
          cache-dependency-path: matrix-bridge/go.sum
      - name: Matrix bridge acceptance rule and pinned trust chain (pure Go, goolm, no cgo)
        working-directory: matrix-bridge
        env:
          CGO_ENABLED: "0"
        run: |
          go mod verify
          go vet -tags goolm ./...
          go test -tags goolm -count=1 -v ./...
      - name: Dispatcher controls (halt, caps, spend cap, all-failed alarm, state lock; heartbeats ship off)
        run: bash scheduled-tasks/dispatcher-selftest.sh

  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t behalfbot-open:ci .
      - name: Boot self-test (serve's uid and caps, read-only rootfs, no network)
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp \
            --tmpfs /var/lib/opencode/state:uid=1000,gid=1000,mode=0700 \
            --tmpfs /var/cache/opencode:uid=1000,gid=1000,mode=0700 \
            --tmpfs /home/node/.cache:uid=1000,gid=1000 \
            --tmpfs /home/node/.local/state:uid=1000,gid=1000 \
            -v /var/lib/opencode/data -v /data -v /workspace \
            -e XDG_DATA_HOME=/var/lib/opencode/data -e XDG_STATE_HOME=/var/lib/opencode/state \
            -e XDG_CACHE_HOME=/var/cache/opencode -e XDG_CONFIG_HOME=/etc/opencode-xdg \
            -w /app behalfbot-open:ci bash /app/selftest/run.sh
      - name: Dispatcher self-test inside the image (its bash, jq and coreutils)
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:exec \
            -v "$PWD/scheduled-tasks:/app/scheduled-tasks:ro" \
            -w /app behalfbot-open:ci bash /app/scheduled-tasks/dispatcher-selftest.sh
